<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Simplified Rogue Night eclipse mark, readable at 16-32px in browser tabs. -->
  <!-- Brand: Ink background, Signet Gold corona ring, Obsidian disc, faint Ember warm-side glow. -->
  <defs>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#0A0E1A" stop-opacity="0"/>
      <stop offset="62%" stop-color="#C9A961" stop-opacity="0.9"/>
      <stop offset="78%" stop-color="#C2410C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="10" ry="10" fill="#0A0E1A"/>

  <!-- Corona glow -->
  <circle cx="32" cy="32" r="26" fill="url(#corona)"/>

  <!-- Gold ring (the visible eclipse rim) -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#C9A961" stroke-width="2.5"/>

  <!-- Dark disc (the moon, slightly off-center for the asymmetric corona feel) -->
  <circle cx="31.5" cy="31.5" r="15" fill="#050608"/>

  <!-- Subtle warm flare on the NE side, matching the photographic logo's SW→NE asymmetry -->
  <circle cx="44" cy="22" r="2.5" fill="#C2410C" opacity="0.55"/>
</svg>
